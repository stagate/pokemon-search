<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포켓몬 번호 검색기</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f4f6fb;color:#20242b}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}
.card{background:white;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(20,30,50,.08)}
h1{margin:0 0 6px;font-size:28px}
.sub{color:#6b7280;margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#eef1f6;padding:5px;border-radius:13px;margin-bottom:18px}
.tab{border:0;border-radius:10px;padding:11px;font-size:16px;font-weight:700;background:transparent;cursor:pointer}
.tab.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{font-weight:700;display:block;margin-bottom:8px}
.inputrow{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid #d5dae3;border-radius:12px;padding:13px 14px;font-size:17px;outline:none}
input:focus{border-color:#6875f5;box-shadow:0 0 0 3px rgba(104,117,245,.12)}
button.primary,button.secondary{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
button.primary{background:#4f5eea;color:#fff}
button.secondary{background:#edf0f5;color:#333}
.hint{font-size:13px;color:#7a8190;margin-top:8px}
.results{margin-top:20px;display:grid;gap:9px}
.result{display:flex;align-items:center;justify-content:space-between;border:1px solid #e4e7ed;border-radius:13px;padding:12px 14px}
.num{font-weight:800;min-width:52px}
.name{font-weight:650;text-align:right;flex:1}
.error{background:#fff4f4;border:1px solid #ffd2d2;color:#b42318;border-radius:12px;padding:12px;margin-top:16px}
.actions{display:flex;gap:8px;margin-top:14px}
.empty{color:#8a919d;text-align:center;padding:20px 8px;border:1px dashed #d8dce5;border-radius:13px}
.count{font-size:13px;color:#747b88;margin-top:10px}
@media(max-width:520px){.inputrow{flex-direction:column}button.primary{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎮 포켓몬 번호 검색기</h1>
    <p class="sub">싱글 / 더블 랭킹에서 번호를 최대 6마리까지 한 번에 검색하세요.</p>

    <div class="tabs">
      <button class="tab active" id="singleTab" onclick="setMode('single')">싱글</button>
      <button class="tab" id="doubleTab" onclick="setMode('double')">더블</button>
    </div>

    <label for="numbers">번호 입력</label>
    <div class="inputrow">
      <input id="numbers" inputmode="numeric" autocomplete="off" placeholder="예: 1 25 48 103" onkeydown="if(event.key==='Enter') searchPokemon()">
      <button class="primary" onclick="searchPokemon()">🔍 검색</button>
    </div>
    <div class="hint">공백, 쉼표(,), 슬래시(/)로 구분할 수 있습니다. 최대 6개.</div>

    <div id="message"></div>
    <div id="results" class="results">
      <div class="empty">번호를 입력하면 포켓몬 이름이 여기에 표시됩니다.</div>
    </div>

    <div class="actions">
      <button class="secondary" onclick="clearAll()">↻ 초기화</button>
      <button class="secondary" onclick="copyResults()">📋 결과 복사</button>
    </div>
    <div class="count" id="modeText">현재 모드: 싱글</div>
  </div>
</div>

let mode = "single";
let lastResults = [];

function setMode(next) {
  mode = next;
  document.getElementById("singleTab").classList.toggle("active", mode === "single");
  document.getElementById("doubleTab").classList.toggle("active", mode === "double");
  document.getElementById("modeText").textContent = "현재 모드: " + (mode === "single" ? "싱글" : "더블");
  if (document.getElementById("numbers").value.trim()) searchPokemon();
}

function searchPokemon() {
  const raw = document.getElementById("numbers").value.trim();
  const msg = document.getElementById("message");
  const results = document.getElementById("results");
  msg.innerHTML = "";
  results.innerHTML = "";
  lastResults = [];

  if (!raw) {
    results.innerHTML = '<div class="empty">번호를 입력해 주세요.</div>';
    return;
  }

  const tokens = raw.split(/[\s,\/]+/).filter(Boolean);
  if (tokens.length > 6) {
    msg.innerHTML = '<div class="error">최대 6마리까지 검색할 수 있어요. 현재 ' + tokens.length + '개가 입력되었습니다.</div>';
    return;
  }

  const invalid = [];
  tokens.forEach(token => {
    if (!/^\d+$/.test(token) || Number(token) < 1 || Number(token) > 200 || !data[mode][token]) {
      invalid.push(token);
    }
  });

  if (invalid.length) {
    msg.innerHTML = '<div class="error">확인할 수 없는 번호: ' + invalid.join(", ") + '<br>1~200 사이의 번호만 입력해 주세요.</div>';
    return;
  }

  tokens.forEach(token => {
    const name = data[mode][token];
    lastResults.push({number: token, name});
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = '<span class="num">' + token + '번</span><span class="name">' + name + '</span>';
    results.appendChild(div);
  });
}

function clearAll() {
  document.getElementById("numbers").value = "";
  document.getElementById("message").innerHTML = "";
  document.getElementById("results").innerHTML = '<div class="empty">번호를 입력하면 포켓몬 이름이 여기에 표시됩니다.</div>';
  lastResults = [];
}

async function copyResults() {
  if (!lastResults.length) {
    document.getElementById("message").innerHTML = '<div class="error">먼저 번호를 검색해 주세요.</div>';
    return;
  }
  const text = lastResults.map(x => x.number + "번 " + x.name).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("message").innerHTML = '<div style="margin-top:12px;color:#16794a;font-size:14px">✓ 결과를 클립보드에 복사했습니다.</div>';
  } catch(e) {
    document.getElementById("message").innerHTML = '<div class="error">복사에 실패했습니다. 결과를 직접 선택해 주세요.</div>';
  }
}
</script>
